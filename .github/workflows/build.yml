name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Vidra.xcodeproj -target Vidra -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|BUILD FAILED" build.log | head -80; exit 1; }
          grep -cE "warning:" build.log || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Vidra.app Payload/
          zip -qry Vidra.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Vidra-ipa
          path: Vidra.ipa
